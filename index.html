<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}

.container {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 40px;
  max-width: 520px;
  width: 90%;
  text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
}

h1 {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 28px;
  background: linear-gradient(90deg, #f7971e, #ffd200);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.scoreboard {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 30px;
}

.score {
  background: rgba(255, 255, 255, 0.06);
  border-radius: 12px;
  padding: 12px 20px;
  min-width: 90px;
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.score-label {
  display: block;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  opacity: 0.6;
  margin-bottom: 4px;
}

.score-value {
  font-size: 32px;
  font-weight: 700;
}

.choices-display {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-bottom: 20px;
}

.choice-box {
  background: rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  padding: 20px;
  min-width: 120px;
  border: 2px solid transparent;
  transition: border-color 0.3s, transform 0.3s;
}

.choice-box .choice-label {
  display: block;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  opacity: 0.5;
  margin-top: 8px;
}

#player-choice-icon,
#ai-choice-icon {
  font-size: 52px;
  display: block;
  line-height: 1;
}

.vs {
  font-size: 18px;
  font-weight: 700;
  opacity: 0.3;
  letter-spacing: 2px;
}

.result {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 28px;
  min-height: 36px;
  transition: color 0.3s;
}

.result.win { color: #4ade80; }
.result.lose { color: #f87171; }
.result.tie { color: #facc15; }

.buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 20px;
}

.choice-btn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 16px;
  padding: 16px 20px;
  cursor: pointer;
  transition: all 0.2s;
  flex: 1;
  max-width: 130px;
  color: #fff;
  font-family: inherit;
  font-size: inherit;
}

.choice-btn:hover {
  background: rgba(255, 255, 255, 0.15);
  transform: translateY(-4px);
  border-color: rgba(255, 255, 255, 0.25);
}

.choice-btn:active {
  transform: translateY(0);
}

.choice-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none !important;
}

.btn-icon {
  font-size: 40px;
  display: block;
  margin-bottom: 6px;
}

.btn-label {
  font-size: 14px;
  font-weight: 600;
}

.reset-btn {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  padding: 10px 24px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}

.reset-btn:hover {
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
}

.reset-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}
  </style>
</head>
<body>
  <div class="container">
    <h1>Rock Paper Scissors</h1>

    <div class="scoreboard">
      <div class="score">
        <span class="score-label">You</span>
        <span id="player-score" class="score-value">0</span>
      </div>
      <div class="score">
        <span class="score-label">Ties</span>
        <span id="tie-score" class="score-value">0</span>
      </div>
      <div class="score">
        <span class="score-label">AI</span>
        <span id="ai-score" class="score-value">0</span>
      </div>
    </div>

    <div class="choices-display">
      <div class="choice-box" id="player-choice-box">
        <span id="player-choice-icon">🤜</span>
        <span class="choice-label">You</span>
      </div>
      <span class="vs">VS</span>
      <div class="choice-box" id="ai-choice-box">
        <span id="ai-choice-icon">🤛</span>
        <span class="choice-label">AI</span>
      </div>
    </div>

    <div id="result" class="result">Choose your move!</div>

    <div class="buttons">
      <button class="choice-btn" onclick="playRound('rock')">
        <span class="btn-icon">🪨</span>
        <span class="btn-label">Rock</span>
      </button>
      <button class="choice-btn" onclick="playRound('paper')">
        <span class="btn-icon">📄</span>
        <span class="btn-label">Paper</span>
      </button>
      <button class="choice-btn" onclick="playRound('scissors')">
        <span class="btn-icon">✂️</span>
        <span class="btn-label">Scissors</span>
      </button>
    </div>

    <button id="reset-btn" class="reset-btn" onclick="resetScores()">Reset Scores</button>
  </div>

  <script>
const choices = ['rock', 'paper', 'scissors'];

const choiceIcons = {
  rock: '🪨',
  paper: '📄',
  scissors: '✂️',
};

const state = {
  playerScore: 0,
  aiScore: 0,
  ties: 0,
};

let isPlaying = false;

function getAIChoice() {
  return choices[Math.floor(Math.random() * choices.length)];
}

function getWinner(player, ai) {
  if (player === ai) return 'tie';
  if (
    (player === 'rock' && ai === 'scissors') ||
    (player === 'paper' && ai === 'rock') ||
    (player === 'scissors' && ai === 'paper')
  ) {
    return 'win';
  }
  return 'lose';
}

function updateScores() {
  document.getElementById('player-score').textContent = state.playerScore;
  document.getElementById('ai-score').textContent = state.aiScore;
  document.getElementById('tie-score').textContent = state.ties;
}

function triggerBounce() {
  const boxes = [document.getElementById('player-choice-box'), document.getElementById('ai-choice-box')];
  boxes.forEach(box => {
    box.classList.remove('bounce-once');
    void box.offsetHeight;
    box.classList.add('bounce-once');
  });
}

function revealChoices(playerChoice, aiChoice, result) {
  const playerIcon = document.getElementById('player-choice-icon');
  const aiIcon = document.getElementById('ai-choice-icon');
  const resultEl = document.getElementById('result');
  const playerBox = document.getElementById('player-choice-box');
  const aiBox = document.getElementById('ai-choice-box');

  playerBox.classList.remove('bounce-once');
  aiBox.classList.remove('bounce-once');

  playerIcon.textContent = choiceIcons[playerChoice];
  aiIcon.textContent = choiceIcons[aiChoice];

  resultEl.className = 'result';

  if (result === 'win') {
    state.playerScore++;
    resultEl.textContent = 'You Win! 🎉';
    resultEl.classList.add('win');
    playerBox.style.borderColor = '#4ade80';
    aiBox.style.borderColor = 'transparent';
  } else if (result === 'lose') {
    state.aiScore++;
    resultEl.textContent = 'AI Wins! 😤';
    resultEl.classList.add('lose');
    aiBox.style.borderColor = '#f87171';
    playerBox.style.borderColor = 'transparent';
  } else {
    state.ties++;
    resultEl.textContent = "It's a Tie! 🤝";
    resultEl.classList.add('tie');
    playerBox.style.borderColor = '#facc15';
    aiBox.style.borderColor = '#facc15';
  }

  updateScores();

  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = false);
  document.getElementById('reset-btn').disabled = false;
  isPlaying = false;
}

function playRound(playerChoice) {
  if (isPlaying) return;
  isPlaying = true;

  const aiChoice = getAIChoice();
  const playerIcon = document.getElementById('player-choice-icon');
  const aiIcon = document.getElementById('ai-choice-icon');
  const resultEl = document.getElementById('result');
  const playerBox = document.getElementById('player-choice-box');
  const aiBox = document.getElementById('ai-choice-box');

  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
  document.getElementById('reset-btn').disabled = true;

  playerIcon.textContent = '🤜';
  aiIcon.textContent = '🤛';
  playerBox.style.borderColor = 'transparent';
  aiBox.style.borderColor = 'transparent';
  resultEl.className = 'result';
  resultEl.textContent = '';

  const phrases = ['Rock!', 'Paper!', 'Scissors!', 'Shoot!'];

  phrases.forEach((phrase, i) => {
    setTimeout(() => {
      resultEl.textContent = phrase;
      if (i < phrases.length - 1) {
        triggerBounce();
      } else {
        revealChoices(playerChoice, aiChoice, getWinner(playerChoice, aiChoice));
      }
    }, i * 1000);
  });
}

function resetScores() {
  if (isPlaying) return;
  state.playerScore = 0;
  state.aiScore = 0;
  state.ties = 0;

  document.getElementById('player-score').textContent = '0';
  document.getElementById('ai-score').textContent = '0';
  document.getElementById('tie-score').textContent = '0';

  document.getElementById('player-choice-icon').textContent = '🤜';
  document.getElementById('ai-choice-icon').textContent = '🤛';
  document.getElementById('result').textContent = 'Choose your move!';
  document.getElementById('result').className = 'result';
  document.getElementById('player-choice-box').style.borderColor = 'transparent';
  document.getElementById('ai-choice-box').style.borderColor = 'transparent';
  document.getElementById('player-choice-box').classList.remove('bounce-once');
  document.getElementById('ai-choice-box').classList.remove('bounce-once');
}
  </script>
</body>
</html>
